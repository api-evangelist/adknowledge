name: AdKnowledge
description: 'Adknowledge, Inc. was a performance-based digital advertising and marketing technology
  holding company founded in 2004 by Scott Lynn and headquartered in Kansas City, Missouri. It ran a
  response-based targeting marketplace that connected advertisers to consumers across email, search,
  domains, social and app inventory, and it exposed a publisher-facing AdStation platform with an
  automated offer engine and creative library. Ben Legg served as Group CEO from 2011 to 2016, during
  which the company consolidated a long acquisition run (Super Rewards, Miva, Cubics, Lookery, Hydra
  Group, AdParlor, Giant Media, TriVu Media and others) into video and social units that were then
  sold off; AdParlor was subsequently acquired by Fluent in 2019. Third-party company registries now
  list Adknowledge as out of business. It entered the API Evangelist network as a portfolio-lead stub
  via kleiner-perkins. Contemporary integration write-ups confirm a historical RESTful AdStation /
  Publisher Platform API, but as of this enrichment pass no live surface survives: the adknowledge.com
  zone is still registered (AWS Route 53 nameservers, Microsoft 365 mail with an SPF record) yet
  publishes no A record for the apex or for www, api, developer, developers, docs or publisher, so
  there is no reachable website, developer portal, API documentation or machine-readable specification
  from which to harvest provider artifacts.'
